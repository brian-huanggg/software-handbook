# Lint the Python examples. Most are standalone scripts, so there is no
# shared test suite to run here.
name: python

on:
  pull_request:
    paths:
      - "playground/**/*.py"
      - "playground/**/pyproject.toml"
      - ".github/workflows/python.yml"
  push:
    branches: [main]
    paths:
      - "playground/**/*.py"
      - "playground/**/pyproject.toml"
      - ".github/workflows/python.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          src: playground
