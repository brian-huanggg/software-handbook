# 刻意用非預設 port 55434，避免和本機資料庫，
# 或同一節其他範例的 55432、55433 衝突。
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    ports:
      - "55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d demo"]
      interval: 2s
      timeout: 3s
      retries: 30
