apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shortener.fullname" . }}
  labels:
    {{- include "shortener.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "shortener.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shortener.selectorLabels" . | nindent 8 }}
      # TODO 1: 加上 checksum/config annotation，ConfigMap 變了 Pod 才會重啟
    spec:
      containers:
        - name: shortener
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          envFrom:
            - configMapRef:
                name: {{ include "shortener.fullname" . }}
          env:
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret.name }}
                  key: {{ .Values.databaseSecret.key }}
          # TODO 2: 把 .Values.resources 渲染成 resources 區塊；沒設定時不要輸出
