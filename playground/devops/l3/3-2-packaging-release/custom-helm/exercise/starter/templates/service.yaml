apiVersion: v1
kind: Service
metadata:
  name: {{ include "shortener.fullname" . }}
  labels:
    {{- include "shortener.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "shortener.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
