events {}

http {
    # Default: round robin. The old machine (.13) is about half as fast.
    upstream read_weighted {
        zone read_weighted 64k;
        server 10.0.1.11:8080 weight=2;
        server 10.0.1.12:8080 weight=2;
        server 10.0.1.13:8080 weight=1;
    }

    # Same servers, balanced by in-flight connections per weight.
    upstream read_least_conn {
        zone read_least_conn 64k;
        least_conn;
        server 10.0.1.11:8080 weight=2;
        server 10.0.1.12:8080 weight=2;
        server 10.0.1.13:8080 weight=1;
    }

    # Pick two at random, keep the less busy one.
    upstream read_random_two {
        zone read_random_two 64k;
        random two least_conn;
        server 10.0.1.11:8080;
        server 10.0.1.12:8080;
        server 10.0.1.13:8080;
    }

    # Admin console keeps its session in instance memory.
    upstream admin_ip_hash {
        ip_hash;
        server 10.0.3.11:8080;
        server 10.0.3.12:8080;
    }

    upstream admin_cookie {
        zone admin_cookie 64k;
        hash $cookie_sid consistent;
        server 10.0.3.11:8080;
        server 10.0.3.12:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://read_least_conn;
        }

        location /admin/ {
            proxy_pass http://admin_cookie;
        }
    }
}

# Layer 4: nginx forwards bytes and never parses the protocol.
stream {
    upstream db_nodes {
        zone db_nodes 64k;
        least_conn;
        server 10.0.2.11:3306;
        server 10.0.2.12:3306;
        server 10.0.2.13:3306;
    }

    server {
        listen 3306;
        proxy_pass db_nodes;
    }
}
