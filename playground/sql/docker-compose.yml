services:
  postgres:
    image: postgres:16
    container_name: sql-bootcamp
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bootcamp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次啟動（資料目錄為空）時，依檔名順序自動執行
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bootcamp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
