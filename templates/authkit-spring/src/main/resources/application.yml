server:
  # Finish in-flight requests on SIGTERM.
  shutdown: graceful
  tomcat:
    connection-timeout: 10s
    keep-alive-timeout: 60s

spring:
  lifecycle:
    timeout-per-shutdown-phase: 10s
  application:
    name: authkit-spring
  main:
    banner-mode: off
  autoconfigure:
    # No generated in-memory user: authentication is our own session and JWT filters.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jackson:
    deserialization:
      # Boot turns this off by default. Reject unknown JSON fields.
      fail-on-unknown-properties: true
      # Exactly one JSON value: {...}{...} is rejected.
      fail-on-trailing-tokens: true

logging:
  pattern:
    # Boot's slot for correlation IDs: the text format shows the request ID on
    # every line written while a request is handled. JSON logs get it as a field.
    correlation: "[%X{request_id:--}] "

# Every setting comes from an environment variable.
# An unset or empty variable means "use the default"; required ones are
# checked in AuthkitProperties so the app never starts with an unsafe default.
authkit:
  addr: ${ADDR:}
  database-url: ${DATABASE_URL:}
  jwt-secret: ${JWT_SECRET:}
  jwt-previous-secrets: ${JWT_PREVIOUS_SECRETS:}
  jwt-issuer: ${JWT_ISSUER:}
  password-pepper: ${PASSWORD_PEPPER:}
  password-previous-peppers: ${PASSWORD_PREVIOUS_PEPPERS:}
  cors-origins: ${CORS_ORIGINS:}
  log-format: ${LOG_FORMAT:}
  cookie-insecure: ${COOKIE_INSECURE:}
  rate-limit-ip-burst: ${RATE_LIMIT_IP_BURST:}
  rate-limit-email-burst: ${RATE_LIMIT_EMAIL_BURST:}
