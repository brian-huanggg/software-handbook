services:
  db:
    image: postgres:16@sha256:63e83b5a3dc36a917dccb76fe1bd2ac51f1ec9c1deb47ff20d4f04233bf6eae9
    environment:
      POSTGRES_USER: authkit
      POSTGRES_PASSWORD: authkit
      POSTGRES_DB: authkit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authkit -d authkit"]
      interval: 2s
      timeout: 3s
      retries: 20

  # One-shot: applies ./migrations, then exits. The API waits for it.
  migrate:
    image: migrate/migrate:v4.19.0@sha256:d5c978181e3bfa55cc50e3bd8d7da3d87418a87693453250a8804b81ee6494db
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://authkit:authkit@db:5432/authkit?sslmode=disable"
      - "up"
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://authkit:authkit@db:5432/authkit?sslmode=disable
      # Empty when unset: the API then refuses to start with a clear error,
      # while `docker compose up db web` keeps working without it.
      JWT_SECRET: ${JWT_SECRET:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      CORS_ORIGINS: http://localhost:3000
      # Brute-force limiter bursts; empty means the built-in defaults (20, 5).
      # `make integration` raises them: the suite logs in many times from one IP.
      RATE_LIMIT_IP_BURST: ${RATE_LIMIT_IP_BURST:-}
      RATE_LIMIT_EMAIL_BURST: ${RATE_LIMIT_EMAIL_BURST:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 20

  # The same API as a Spring Boot app (../authkit-spring). Opt-in:
  #   docker compose --profile java up -d --build api-java
  # It shares the database and the schema with `api`, and listens on host port
  # 8082 so both can run side by side. To point the web front end at it, run
  # `WEB_API_URL=http://localhost:8082 docker compose --profile java up -d --build api-java web`.
  api-java:
    profiles: ["java"]
    build: ../authkit-spring
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://authkit:authkit@db:5432/authkit?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      CORS_ORIGINS: http://localhost:3000
      RATE_LIMIT_IP_BURST: ${RATE_LIMIT_IP_BURST:-}
      RATE_LIMIT_EMAIL_BURST: ${RATE_LIMIT_EMAIL_BURST:-}
    ports:
      - "${API_JAVA_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD", "java", "-jar", "/app/app.jar", "healthcheck"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20

  # Static front end on its own origin (http://localhost:3000), so the demo
  # exercises real CORS and cross-origin cookie rules against the API.
  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${WEB_API_URL:-http://localhost:8080}
    environment:
      API_ORIGIN: ${WEB_API_URL:-http://localhost:8080}
    ports:
      - "3000:80"

volumes:
  pgdata:
